<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="icon" type="image/png" href="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <style>
        .card {
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            background-color: rgba(255, 255, 255, 0.75);
            border-radius: 12px;
            border: 1px solid rgba(209, 213, 219, 0.3);

        }

        #weather_img {
            margin-left: 8rem;

        }

        body {
            background: linear-gradient(321deg, lightblue, white);
            min-height: 100vh;
        }

        .weather {
            display: none;
        }
    </style>


</head>

<body>

    <div class="container">
        <div class="row">
            <div class="col-4"></div>
            <div class="col-4 mt-5">
                <div class="card p-3 ">
                    <div class="d-flex">
                        <input id="cityname" type="text" placeholder="Enter your city"
                            class="rounded-pill w-50 ms-5 shadow border-light mt-5">
                        <button class="btn ms-3 w-15 h-15 fw-bold text-white bg-info mt-5"
                            onclick="check()">Check</button>
                    </div>

                    <div class="weather">
                        <img src="./images/sunny.png" alt="" class="mt-4" width="150px" height="150px" id="weather_img">
                        <h1 class="text-center fw-bold text-primary" id="temperature"></h1>
                        <h2 class="text-center fw-bold text-primary" id="city"></h2>
                        <div class="row d-flex justify-content-start">
                            <div class="col-6 d-flex">
                                <img src="./images/humidity.webp" alt="" width="50px" class="ms-5 mt-4">
                                <p id="humidity" class="mt-5 ms-3 fw-bold text-primary"></p>
                            </div>
                            <div class="col-6 d-flex justify-content-start">
                                <img src="./images/wind_speed.png" alt="" width="80px" height="70px" class="ms-3 mt-4">
                                <p id="windspeed" class="mt-5 ms-1 fw-bold text-primary"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-4"></div>
        </div>
    </div>
    <script src="./script.js"></script>

</body>


</html>
