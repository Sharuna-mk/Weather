<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="icon" type="image/png" href="">
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

        <!--fontawesome  -->


        <style>
            .card{
                background:linear-gradient(321deg,skyblue,white)

            }
           #weather_img{
                margin-left: 8rem;
            
            }

            .weather{
                display: none;
            }
        </style>

        
</head>

<body>
  
    <div class="container">
        <div class="row">
            <div class="col-4"></div>
            <div class="col-4 mt-5">
                <div class="card p-3 ">
                 <div class="d-flex">
                     <input id="cityname" type="text" placeholder="Enter your city" class="rounded-pill w-50 ms-5 shadow border-light mt-5">
                  <button class="btn ms-3 w-15 h-15 fw-bold text-white bg-info mt-5" onclick="check()">Check</button>
                 </div>
                
                 <div class="weather">
                    <img src="./images/sunny.png" alt="" class="mt-4" width="150px" height="150px" id="weather_img">
                    <h1 class="text-center fw-bold text-primary" id="temperature">22°C</h1>
                    <h2 class="text-center fw-bold text-primary" id="city">New York</h2>
                   <div class="row d-flex justify-content-start">
                     <div class="col-6 d-flex">
                        <img src="./images/humidity.webp" alt="" width="50px" class="ms-5 mt-4">
                        <p id="humidity" class="mt-5 ms-3 fw-bold text-primary">50%</p>
                    </div>
                    <div class="col-6 d-flex justify-content-start">
                         <img src="./images/wind_speed.png" alt="" width="80px" height="70px" class="ms-3 mt-4">
                        <p id="windspeed" class="mt-5 ms-1 fw-bold text-primary">20 km/hr</p>
                    </div>
                   </div>
                 </div>
                </div>
            </div>
            <div class="col-4"></div>
        </div>
    </div>

    


<script>
const apikey="5bb7ac7b8094e09d81af8379d923f3ba"
const apiURL="https://api.openweathermap.org/data/2.5/weather?units=metric&q="
const searchBox=document.querySelector("#cityname")



async function checkweather(city) {

    const response=await fetch(apiURL + city + `&appid=${apikey}`);
    var data=await response.json();
    console.log(data);
    
   if(response.status==404){
       alert("invalid city name")
    }

    else if(searchBox.value ==""){
        alert("please enter city name")
    }
   else{
    
    document.querySelector('#city').innerHTML=data.name;
    document.querySelector('#temperature').innerHTML=Math.round(data.main.temp)+"°C";
    document.querySelector('#humidity').innerHTML=data.main.humidity+"%";
    document.querySelector('#windspeed').innerHTML=data.wind.speed+"km/hr"; 

    document.querySelector('.weather').style.display="block"
}}



function check(){
    checkweather(searchBox.value)
}


</script>

</body>


</html>
